<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Shoes</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topo">
      <a href="index.html"><img src="img/logo.jpg" alt="Shop Shoes"></a>
      <nav>
        <button class="filtro" data-filtro="todos">Todos</button>
        <button class="filtro" data-filtro="corrida">Corrida</button>
        <button class="filtro" data-filtro="casual">Casual</button>
        <button class="filtro" data-filtro="retro">Retrô</button>
        <button class="filtro" data-filtro="street">Street</button>
        <a class="filtro" id="link-carrinho" href="carrinho.html">Carrinho (0)</a>
      </nav>
    </div>
  </header>
  <main class="conteudo">
    <section class="hero">
      <div>
        <h1>O tênis certo para o seu estilo</h1>
        <p>Veja os modelos, e a loja aprende o que você gosta para sugerir os mais parecidos.</p>
        <button class="botao" data-filtro="todos">Ver todos os tênis</button>
      </div>
      <img src="img/banner.webp" alt="Tênis em destaque">
    </section>
    <section id="recomendados" hidden>
      <h2>Recomendados para você</h2>
      <div id="grade-recomendados" class="grade"></div>
    </section>
    <h2>Categorias</h2>
    <section class="categorias">
      <button class="cat" data-filtro="corrida"><img src="img/cat-corrida.webp" alt=""><span>Corrida</span></button>
      <button class="cat" data-filtro="casual"><img src="img/cat-casual.webp" alt=""><span>Casual</span></button>
      <button class="cat" data-filtro="retro"><img src="img/cat-retro.webp" alt=""><span>Retrô</span></button>
      <button class="cat" data-filtro="street"><img src="img/cat-street.webp" alt=""><span>Street</span></button>
    </section>
    <h2 id="catalogo"><span id="titulo-catalogo">Todos os tênis</span></h2>
    <div id="grade"></div>
  </main>
  <footer>Shop Shoes é uma loja fictícia de portfólio. Pagamentos apenas em ambiente de teste.</footer>
  <script src="recomendacao.js"></script>
  <script src="carrinho.js"></script>
  <script src="app.js"></script>
</body>
</html>
